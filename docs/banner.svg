<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%">
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#faf7f0"/><stop offset="1" stop-color="#e3ecd6"/></linearGradient>
    <linearGradient id="tx" x1="0" x2="1"><stop offset="0" stop-color="#2d4a2b"><animate attributeName="stop-color" values="#2d4a2b;#c2994a;#2d4a2b" dur="6s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#5f9a54"><animate attributeName="stop-color" values="#5f9a54;#2d4a2b;#5f9a54" dur="6s" repeatCount="indefinite"/></stop></linearGradient>
  </defs>
  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <g font-size="54">
    <text x="80" y="80">🌾<animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="3s" repeatCount="indefinite"/></text>
    <text x="1040" y="100">🍅<animateTransform attributeName="transform" type="translate" values="0 0;0 -18;0 0" dur="3.6s" repeatCount="indefinite"/></text>
    <text x="960" y="300">🚚<animateTransform attributeName="transform" type="translate" values="0 0;-30 0;0 0" dur="4s" repeatCount="indefinite"/></text>
    <text x="130" y="300">🥬<animateTransform attributeName="transform" type="translate" values="0 0;0 -16;0 0" dur="3.3s" repeatCount="indefinite"/></text>
  </g>
  <text x="600" y="160" text-anchor="middle" font-family="Georgia,serif" font-size="88" font-weight="700" fill="url(#tx)" letter-spacing="4">FarmConnect<animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/></text>
  <text x="600" y="212" text-anchor="middle" font-family="Georgia,serif" font-size="25" fill="#6b7466" letter-spacing="6">STRAIGHT FROM THE FARM. NATURALLY YOURS.</text>
  <line x1="420" y1="238" x2="780" y2="238" stroke="#c2994a" stroke-width="3" stroke-linecap="round" stroke-dasharray="360" stroke-dashoffset="360"><animate attributeName="stroke-dashoffset" values="360;0;360" dur="5s" repeatCount="indefinite"/></line>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#2d4a2b" text-anchor="middle">
    <g><rect x="190" y="262" width="150" height="34" rx="17" fill="#e8efde"/><text x="265" y="284">M1 Marketplace</text></g>
    <g><rect x="360" y="262" width="150" height="34" rx="17" fill="#e8efde"/><text x="435" y="284">M2 Services</text></g>
    <g><rect x="530" y="262" width="150" height="34" rx="17" fill="#e8efde"/><text x="605" y="284">Outbox events</text></g>
    <g><rect x="700" y="262" width="150" height="34" rx="17" fill="#e8efde"/><text x="775" y="284">Redis cache</text></g>
    <g><rect x="870" y="262" width="140" height="34" rx="17" fill="#e8efde"/><text x="940" y="284">Secure by design</text></g>
    <animate attributeName="opacity" values="0;1" dur="1.2s" begin="1s" fill="freeze"/>
  </g>
</svg>